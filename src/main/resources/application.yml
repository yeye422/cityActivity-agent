spring:
  application:
    name: city-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/city_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.city.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}

amap:
  web-service-key: ${AMAP_WEB_SERVICE_KEY:}

qweather:
  # 在和风天气控制台 -> 设置中复制专属 API Host（不含 https://）
  api-host: ${QWEATHER_API_HOST:}
  # 仅服务端读取；不要放入前端 JavaScript 或提交到仓库
  api-key: ${QWEATHER_API_KEY:}


diet:
  prompt:
    version: v9
  rule:
    version: v10
  llm:
    main-model: qwen-max
    light-model: qwen-turbo
    response-model: qwen-turbo
  session:
    max-history-turns: 10
logging:
  level:
    com.city: INFO
