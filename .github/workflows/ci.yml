name: CI

on:
  push:
    branches:
      - main
      - chore/initial-secure-import
  pull_request:
    branches:
      - main
      - chore/initial-secure-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Check frontend JavaScript syntax
        run: |
          node --check src/main/resources/static/assets/js/api.js
          node --check src/main/resources/static/assets/js/app.js

      - name: Build and run tests
        run: mvn -B -ntp clean verify
